<style>
#drag-point { cursor: grab; touch-action: none; }
#drag-point:active { cursor: grabbing; }
</style>
<h2 style="position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Interactive diagram: drag a point between two overlapping clusters to see its soft-clustering responsibilities update live</h2>
<svg id="scene" width="100%" viewBox="0 0 680 380" role="img">
<title>Soft clustering responsibilities update as a point moves</title>
<desc>Two overlapping Gaussian clusters with a draggable point whose probability of belonging to each cluster updates live based on its position.</desc>

<g class="c-blue">
  <ellipse cx="190" cy="210" rx="120" ry="95" style="fill-opacity:0.3" stroke-width="0.5"/>
  <text class="th" x="140" y="130" text-anchor="middle" dominant-baseline="central">Cluster A</text>
</g>
<g class="c-coral">
  <ellipse cx="430" cy="210" rx="120" ry="95" style="fill-opacity:0.3" stroke-width="0.5"/>
  <text class="th" x="480" y="130" text-anchor="middle" dominant-baseline="central">Cluster B</text>
</g>

<line x1="310" y1="90" x2="310" y2="330" stroke="var(--text-secondary)" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
<text class="ts" x="310" y="75" text-anchor="middle" dominant-baseline="central">Hard boundary (k-means)</text>

<line id="leader" class="leader" x1="310" y1="210" x2="500" y2="150"/>
<path id="wedge-a" fill="#185FA5"/>
<path id="wedge-b" fill="#993C1D"/>
<text class="th" x="500" y="65" text-anchor="middle" dominant-baseline="central">Responsibility split</text>
<text id="pct-a" class="ts" x="500" y="152" text-anchor="middle" dominant-baseline="central">50% cluster A</text>
<text id="pct-b" class="ts" x="500" y="167" text-anchor="middle" dominant-baseline="central">50% cluster B</text>

<circle id="drag-point" cx="310" cy="210" r="8" stroke="#2C2C2A" stroke-width="0.5" fill="#7A6C6C"/>
</svg>
<div style="margin-top:0.5rem;font-size:13px;color:var(--text-secondary)">Drag the point to see how location changes its cluster probabilities.</div>
<div id="readout" style="margin-top:0.4rem;font-size:14px;color:var(--text-primary)">k-means would assign: <span id="hard-label">Cluster A</span></div>
<script>
(function(){
  const svg = document.getElementById('scene');
  const pt = document.getElementById('drag-point');
  const wedgeA = document.getElementById('wedge-a');
  const wedgeB = document.getElementById('wedge-b');
  const pctA = document.getElementById('pct-a');
  const pctB = document.getElementById('pct-b');
  const leader = document.getElementById('leader');
  const hardLabel = document.getElementById('hard-label');
  const cA = {x:190,y:210,sx:60,sy:47};
  const cB = {x:430,y:210,sx:60,sy:47};
  const pieCx = 500, pieCy = 110, pieR = 30;
  const minX = 60, maxX = 620, minY = 80, maxY = 330;

  function toSVGPoint(evt){
    const p = svg.createSVGPoint();
    p.x = evt.clientX; p.y = evt.clientY;
    const ctm = svg.getScreenCTM().inverse();
    return p.matrixTransform(ctm);
  }
  function gauss(x,y,c){
    const dx=(x-c.x)/c.sx, dy=(y-c.y)/c.sy;
    return Math.exp(-0.5*(dx*dx+dy*dy));
  }
  function lerpColor(c1,c2,t){
    const p1 = [parseInt(c1.slice(1,3),16),parseInt(c1.slice(3,5),16),parseInt(c1.slice(5,7),16)];
    const p2 = [parseInt(c2.slice(1,3),16),parseInt(c2.slice(3,5),16),parseInt(c2.slice(5,7),16)];
    const rgb = p1.map((v,i)=>Math.round(v+(p2[i]-v)*t));
    return '#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function pieArc(fA){
    const theta = fA*2*Math.PI;
    const x1 = pieCx+pieR, y1 = pieCy;
    const x2 = pieCx+pieR*Math.cos(theta), y2 = pieCy+pieR*Math.sin(theta);
    const largeArc = fA>0.5?1:0;
    wedgeA.setAttribute('d', `M ${pieCx} ${pieCy} L ${x1} ${y1} A ${pieR} ${pieR} 0 ${largeArc} 1 ${x2} ${y2} Z`);
    wedgeB.setAttribute('d', `M ${pieCx} ${pieCy} L ${x2} ${y2} A ${pieR} ${pieR} 0 ${1-largeArc} 1 ${x1} ${y1} Z`);
  }
  function update(x,y){
    x = Math.max(minX, Math.min(maxX, x));
    y = Math.max(minY, Math.min(maxY, y));
    pt.setAttribute('cx', x); pt.setAttribute('cy', y);
    leader.setAttribute('x1', x); leader.setAttribute('y1', y);
    const gA = gauss(x,y,cA), gB = gauss(x,y,cB);
    const fA = gA/(gA+gB);
    pieArc(fA);
    pctA.textContent = Math.round(fA*100)+'% cluster A';
    pctB.textContent = Math.round((1-fA)*100)+'% cluster B';
    pt.setAttribute('fill', lerpColor('#185FA5','#993C1D', 1-fA));
    hardLabel.textContent = x < 310 ? 'Cluster A' : 'Cluster B';
  }
  update(310,210);

  let dragging = false;
  pt.addEventListener('pointerdown', (e)=>{
    dragging = true;
    pt.setPointerCapture(e.pointerId);
  });
  pt.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const p = toSVGPoint(e);
    update(p.x, p.y);
  });
  pt.addEventListener('pointerup', (e)=>{
    dragging = false;
  });
})();
</script>
